{% extends "base.html" %}{% block content %}<h1>Users & roles</h1><section class="card"><h2>Create user</h2><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="grid"><label>Username<input name="username" required minlength="3"></label><label>Temporary password (12+ characters)<input type="password" name="password" required minlength="12"></label><label>Role<select name="role">{% for role in role_options %}<option>{{ role }}</option>{% endfor %}</select></label></div><button class="primary">Create account</button></form></section><section class="card"><h2>Registered accounts</h2>{% for u in users %}<div class="event">{{ u.username }} · {{ 'Active' if u.active else 'Inactive' }}</div>{% endfor %}</section>{% endblock %}
